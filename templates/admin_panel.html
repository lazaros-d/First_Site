<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
</head>
<body>
    <h2>Πίνακας Διαχείρισης</h2>
    <table border="1">
        <tr>
            <th>Όνομα Χρήστη</th>
            <th>Ρόλος</th>
        </tr>
        {% for user in users %}
        <tr>
            <td>{{ user[1] }}</td>
            <td>{% if user[3] == 1 %}Admin{% else %}Κανονικός{% endif %}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
