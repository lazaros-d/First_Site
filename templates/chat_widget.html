<div id="chat-widget" style="position: fixed; bottom: 60px; right: 10px; width: 300px; height: 400px; background: #2e2e3e; border: 1px solid #444; box-shadow: 0 4px 16px rgba(0,0,0,0.6); display: none; flex-direction: column; border-radius: 10px; z-index: 9999; overflow: hidden;">
  <div id="chat-box" style="flex: 1; overflow-y: auto; padding: 10px; font-family: 'Fira Code', monospace, sans-serif; font-size: 14px; background: #1e1e2e; color: #e5e7eb;"></div>
  
  <form id="chat-form" style="display: flex; padding: 8px; border-top: 1px solid #444; background: #2e2e3e;">
    <input type="text" id="chat-input" name="message" placeholder="Γράψε μήνυμα..." required style="flex: 1; padding: 6px; border: 1px solid #555; border-radius: 6px; margin-right: 6px; background: #1e1e2e; color: #e5e7eb;">
    <button type="submit" style="padding: 6px 10px; background: #a78bfa; color: #1e1e2e; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s;">📨</button>
  </form>
</div>

<button id="chat-toggle" style="position: fixed; bottom: 10px; right: 10px; background-color: #a78bfa; color: #1e1e2e; font-weight: bold; padding: 8px 12px; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.4); transition: 0.2s; z-index: 9999;">
  💬 Chat
</button>

<script>
const chatToggle = document.getElementById('chat-toggle');
const chatWidget = document.getElementById('chat-widget');
const chatForm = document.getElementById('chat-form');
const chatInput = document.getElementById('chat-input');
const chatBox = document.getElementById('chat-box');

chatToggle.addEventListener('click', () => {
  if (chatWidget.style.display === 'flex') {
    chatWidget.style.display = 'none';
  } else {
    chatWidget.style.display = 'flex';
    loadMessages();
  }
});

async function loadMessages() {
  try {
    const res = await fetch('/chat/messages');
    if (!res.ok) throw new Error('Failed to load messages');
    const messages = await res.json();
    chatBox.innerHTML = '';
    for (const msg of messages) {
      const div = document.createElement('div');
      div.style.backgroundColor = '#2e2e3e';
      div.style.padding = '6px 10px';
      div.style.borderRadius = '6px';
      div.style.marginBottom = '8px';
      div.style.wordWrap = 'break-word';
      div.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 4px;">
          <span style="font-weight:bold; color:#34d399;">${escapeHtml(msg.username)}</span>
          <span style="font-size:12px; color:#9ca3af;">${escapeHtml(msg.timestamp)}</span>
        </div>
        <div style="color:#e5e7eb;">${escapeHtml(msg.message)}</div>
      `;
      chatBox.appendChild(div);
    }
    chatBox.scrollTop = chatBox.scrollHeight;
  } catch (err) { console.error(err); }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

chatForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = chatInput.value.trim();
  if (!message) return;
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ message })
    });
    if (res.ok) { chatInput.value = ''; loadMessages(); }
    else { console.error('Αποτυχία αποστολής'); }
  } catch (err) { console.error(err); }
});

setInterval(() => { if (chatWidget.style.display === 'flex') loadMessages(); }, 5000);
</script>
