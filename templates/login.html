{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<style>
body {
    height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: url('{{ url_for("static", filename="img/bground.jpg") }}') no-repeat center center fixed;
    background-size: cover;
    font-family: Arial, sans-serif;
}

.login-container {
    background: rgba(255, 255, 255, 0.9);
    padding: 40px 50px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    width: 350px;
    text-align: center;
}

.login-container h1 {
    margin-bottom: 25px;
    color: #1e3a8a;
}

.login-container input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
}

.login-container button {
    width: 100%;
    padding: 12px;
    background-color: #2563eb;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
}

.login-container button:hover {
    background-color: #1e40af;
}

.login-container p {
    margin-top: 15px;
    font-size: 14px;
}

.login-container .error {
    color: red;
    margin-bottom: 12px;
    font-weight: bold;
}
</style>

<div class="login-container">
    <h1>Σύνδεση</h1>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Σύνδεση</button>
    </form>

    <p>Δεν έχετε λογαριασμό; <a href="{{ url_for('register') }}">Εγγραφή</a></p>
</div>
{% endblock %}
