<!DOCTYPE html>
<html>
<head><title>Εγγραφή</title></head>
<body>
    <h2>Δημιουργία Λογαριασμού</h2>
    {% if error %}
        <p style="color:red">{{ error }}</p>
    {% endif %}
    <form method="POST">
        Όνομα χρήστη: <input name="username" required><br>
        Κωδικός: <input name="password" type="password" required><br>
        <button type="submit">Εγγραφή</button>
    </form>
    <p>Έχεις ήδη λογαριασμό; <a href="/login">Σύνδεση</a></p>
</body>
</html>
