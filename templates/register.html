{% extends 'base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<style>
  body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: url('/static/img/bground.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
  }

  .register-container {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 50px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      width: 350px;
      text-align: center;
  }

  .register-container h1 {
      margin-bottom: 25px;
      color: #1e3a8a;
  }

  .register-container input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
  }

  .register-container button {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
  }

  .register-container button:hover {
      background-color: #1e40af;
  }

  .register-container .error {
      color: red;
      margin-bottom: 12px;
      font-weight: bold;
  }

  .register-container p {
      margin-top: 15px;
      font-size: 14px;
  }
</style>

<div class="register-container">
    <h1>Εγγραφή</h1>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Εγγραφή</button>
    </form>

    <p>Έχετε ήδη λογαριασμό; <a href="{{ url_for('login') }}">Σύνδεση</a></p>
</div>
{% endblock %}
